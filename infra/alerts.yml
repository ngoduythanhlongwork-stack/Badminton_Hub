groups:
  - name: badminton-hub-api
    rules:
      - alert: BadmintonHubAPIDown
        expr: up{job="badminton-hub-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Badminton Hub API is unavailable
      - alert: BadmintonHubHighErrorRate
        expr: rate(badminton_http_errors_total[5m]) / clamp_min(rate(badminton_http_requests_total[5m]), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate is above 5 percent
      - alert: BadmintonHubHighLatency
        expr: histogram_quantile(0.95, rate(badminton_http_request_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency is above one second
